[project]
site_name = "Labmill client"
site_description = "A chat front end that runs your research jobs on Slurm clusters."
site_url = "https://docs.labmill.org/"
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "user/index.md",
    "user/install.md",
    "user/first-run.md",
    "user/first-job.md",
    "user/clusters.md",
    "user/data-transfer.md",
    "user/settings.md",
    "user/failed-jobs.md",
    "user/account.md",
    "user/privacy.md",
    "user/faq.md",
    "user/troubleshooting.md",
    "user/desktop-app.md",
    "user/keys.md",
    "user/terminal.md",
    "user/claude-code.md",
    "user/updates.md",
    "user/voice.md",
    "user/contact.md",
  ] },
  { "Developers" = [
    "dev/index.md",
    "dev/architecture.md",
    "dev/ssh.md",
    "dev/tui.md",
    "dev/gui.md",
    "dev/voice.md",
    "dev/testing.md",
    "dev/security.md",
    "dev/sites.md",
    "dev/knowledge-placement.md",
    "dev/ci.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]
