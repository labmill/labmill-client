id: large-output-tail
title: A job with a long output
tags: [output]
prompt: |
  Run a batch job that prints the numbers 1 to 6000000 to its standard output, one number on each line, and then one last line with the sum of all these numbers as a whole number. Write that last line to last.txt.
needs: {cpus: 1, mem_mb: 128}
time_budget: 120
expect:
  outcome: completed
