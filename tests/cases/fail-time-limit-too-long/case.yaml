id: fail-time-limit-too-long
title: A job that asks for a time limit of 400 days
tags: [failure, submit]
prompt: |
  Submit the script hello.sh as a batch job with a time limit of 400 days.
needs: {cpus: 1, mem_mb: 128}
time_budget: 60
expect:
  outcome: failed
  failure_class: submit_rejected
  agent_should: fix_and_resubmit
